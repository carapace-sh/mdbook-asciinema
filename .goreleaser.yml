version: 2
project_name: mdbook-asciinema

builds:
  - id: default
    builder: rust
    tool: cargo
    command: build
    binary: mdbook-asciinema
    targets:
      - x86_64-unknown-linux-gnu
    flags:
      - --release
    env:
      - CARGO_TERM_COLOR=always

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: carapace-sh
    name: mdbook-asciinema
